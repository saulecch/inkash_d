# S17-06: release automático. Corre cuando se hace push de un tag v*:
#   git tag v0.9.0 && git push origin v0.9.0
# Produce el AAB FIRMADO para Google Play y lo adjunta a un GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

# Solo este workflow puede crear Releases (permiso explícito y mínimo).
permissions:
  contents: write

jobs:
  aab:
    name: AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # El tag v0.9.0 debe coincidir con version: 0.9.0+N del pubspec.
      # Si no coinciden, fallar ANTES de compilar (error barato).
      - name: Tag y pubspec coinciden
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con pubspec ($VERSION)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # Los secretos NUNCA están en el repo. Se cargan en
      # Settings > Secrets and variables > Actions:
      #   ANDROID_KEYSTORE_BASE64  (base64 -i inkash-d-upload.jks | pbcopy)
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
      - name: Llave de firma desde GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (ver docs/publicacion/firma.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS

      - run: flutter pub get

      # Mismas pruebas que el CI: nunca se publica algo que no pasa.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter test

      - name: Compilar AAB
        run: flutter build appbundle --release

      # Comprobar que NO salió firmado con la llave de debug.
      - name: Verificar firma
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee firma.txt
          if grep -q "CN=Android Debug" firma.txt; then
            echo "::error::El AAB quedó firmado con la llave de DEBUG"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
